name: Phase 20 Neon DB Integration Tests

on:
  push:
    branches: ["phase-20-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-20-neon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-20-neon:
    name: Phase 20 gates on Neon DB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
      JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ENABLE_DEMO_USERS: ${{ secrets.ENABLE_DEMO_USERS }}
      STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
      STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
      STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      NODE_ENV: development
      API_BASE_URL: http://localhost:4000
      PORT: 4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Deploy migrations to Neon
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Sync permissions
        run: npx prisma db seed
        working-directory: backend

      - name: Lint check
        run: npm run lint
        working-directory: backend

      - name: Build check
        run: npm run build
        working-directory: backend

      - name: Alerts foundation backend test
        run: npx ts-node scripts/notifications-foundation-test.ts
        working-directory: backend

      - name: Dashboard permission gate
        run: npm run test:rbac-dashboard
        working-directory: backend

      - name: Mechanic assignment isolation
        run: npm run test:rbac-mechanic
        working-directory: backend

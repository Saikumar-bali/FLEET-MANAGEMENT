name: Phase 21 Driver Assignment

on:
  push:
    branches: ["phase-21-driver-assignment-workflow"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-21-driver-assignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_phase21_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_phase21_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleet_phase21_test
      NODE_ENV: development
      JWT_SECRET: phase21-ci-secret
      JWT_REFRESH_SECRET: phase21-ci-refresh-secret
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: .storage/uploads
      RECEIPT_EXTRACTION_PROVIDER: mock
      ADMIN_EMAIL: admin@fleet-ci.test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!
      ENABLE_DEMO_USERS: "true"
      API_BASE_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed CI database
        run: npx prisma db seed
        working-directory: backend

      - name: Backend lint
        run: npm run lint
        working-directory: backend

      - name: Backend build
        run: npm run build
        working-directory: backend

      - name: Driver assignment workflow test
        run: npm run test:driver-assignment
        working-directory: backend

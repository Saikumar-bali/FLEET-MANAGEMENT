name: Prisma Migration Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prisma-migration-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_migration_diagnostic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_migration_diagnostic
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleet_migration_diagnostic
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Capture migration deploy output
        shell: bash
        working-directory: backend
        run: |
          set +e
          npx prisma migrate deploy > migration-deploy.log 2>&1
          echo $? > migration-exit.txt
          exit 0
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prisma-migration-diagnostic
          path: |
            backend/migration-deploy.log
            backend/migration-exit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce migration result
        working-directory: backend
        run: |
          cat migration-deploy.log
          test "$(cat migration-exit.txt)" = "0"

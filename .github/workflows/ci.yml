name: CI

on:
  push:
    branches: [phase-8-documents-storage]
  pull_request:
    branches: [phase-8-documents-storage]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      JWT_SECRET: ci-test-secret-not-for-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: .storage/uploads
      RECEIPT_EXTRACTION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run test:api-docs
        working-directory: backend
      - run: npm run test:documents
        working-directory: backend
      - run: npm run test:rbac-documents-negative
        working-directory: backend
      - run: npm run test:fuel-expenses
        working-directory: backend
      - run: npm run test:fuel-receipts
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      JWT_SECRET: ci-test-secret-not-for-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: .storage/uploads
      RECEIPT_EXTRACTION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate && npx prisma migrate deploy
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web

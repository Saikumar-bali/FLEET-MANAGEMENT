name: CI

on:
  push:
    branches: [phase-8-documents-storage]
  pull_request:
    branches: [phase-8-documents-storage]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      NODE_ENV: development
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: .storage/uploads
      RECEIPT_EXTRACTION_PROVIDER: mock
      ADMIN_EMAIL: admin@fleet-ci.test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!
      ENABLE_DEMO_USERS: "true"
      API_BASE_URL: http://localhost:4000
      CI_ADMIN_IDENTIFIER: admin@fleet-ci.test
      CI_ADMIN_PASSWORD: Admin123!
      CI_VIEWER_IDENTIFIER: viewer@fleet-ci.test
      CI_VIEWER_PASSWORD: Viewer123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npx prisma db seed
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run test:api-docs
        working-directory: backend
      - name: Start backend server
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break || sleep 2; done
        working-directory: backend
      - run: npm run test:documents
        working-directory: backend
      - run: npm run test:rbac-documents-negative
        working-directory: backend
      - run: npm run test:fuel-expenses
        working-directory: backend
      - run: npm run test:fuel-receipts
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      NODE_ENV: development
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: .storage/uploads
      RECEIPT_EXTRACTION_PROVIDER: mock
      ADMIN_EMAIL: admin@fleet-ci.test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!
      ENABLE_DEMO_USERS: "true"
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://localhost:4000
      E2E_ADMIN_IDENTIFIER: admin@fleet-ci.test
      E2E_ADMIN_PASSWORD: Admin123!
      E2E_VIEWER_IDENTIFIER: viewer@fleet-ci.test
      E2E_VIEWER_PASSWORD: Viewer123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: backend
      - run: npx prisma generate && npx prisma migrate deploy
        working-directory: backend
      - run: npx prisma db seed
        working-directory: backend
      - name: Start backend server
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break || sleep 2; done
        working-directory: backend
      - run: npm install
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web

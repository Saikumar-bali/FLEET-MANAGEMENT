name: CI, Security and Backend Sync

on:
  push:
    branches: [main, "phase-*", "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
      NODE_ENV: development
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: .storage/uploads
      RECEIPT_EXTRACTION_PROVIDER: mock
      ADMIN_EMAIL: admin@fleet-ci.test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!
      ENABLE_DEMO_USERS: "true"
      API_BASE_URL: http://localhost:4000
      CI_ADMIN_IDENTIFIER: admin@fleet-ci.test
      CI_ADMIN_PASSWORD: Admin123!
      CI_VIEWER_IDENTIFIER: viewer@fleet-ci.test
      CI_VIEWER_PASSWORD: Viewer123!
      CI_MANAGER_IDENTIFIER: manager@fleet-ci.test
      CI_MANAGER_PASSWORD: Manager123!
      CI_SUPERVISOR_IDENTIFIER: supervisor@fleet-ci.test
      CI_SUPERVISOR_PASSWORD: Supervisor123!
      CI_DRIVER_IDENTIFIER: driver@fleet-ci.test
      CI_DRIVER_PASSWORD: Driver123!
      CI_ASSISTANT_DRIVER_IDENTIFIER: assistantdriver@fleet-ci.test
      CI_ASSISTANT_DRIVER_PASSWORD: Asst123!
      CI_MECHANIC_IDENTIFIER: mechanic@fleet-ci.test
      CI_MECHANIC_PASSWORD: Mechanic123!
      CI_COLLECTOR_IDENTIFIER: collector@fleet-ci.test
      CI_COLLECTOR_PASSWORD: Collector123!
      CI_FINANCE_IDENTIFIER: finance@fleet-ci.test
      CI_FINANCE_PASSWORD: Finance123!
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed CI database
        run: npx prisma db seed
        working-directory: backend

      - name: Seed vehicle checkout permissions
        run: npm run seed:vehicle-checkout-permissions
        working-directory: backend

      - name: Seed role templates
        run: npm run seed:role-templates
        working-directory: backend

      - name: Backend lint
        run: npm run lint
        working-directory: backend

      - name: Backend build
        run: npm run build
        working-directory: backend

      - name: API documentation coverage
        run: npm run test:api-docs
        working-directory: backend

      - name: Account scope tests
        run: npm run test:account-scope
        working-directory: backend

      - name: Access service smoke test
        run: npm run access:smoke
        working-directory: backend

      - name: Access diagnostics
        run: npm run access:diagnose
        working-directory: backend

      - name: Module scope tests
        run: npm run test:module-scope
        working-directory: backend

      - name: Notifications foundation test
        run: npx ts-node scripts/notifications-foundation-test.ts
        working-directory: backend

      - name: Driver assignment workflow test
        run: npm run test:driver-assignment
        working-directory: backend

      - name: Start backend server
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          npm run dev > /tmp/fleet-backend.log 2>&1 &
          echo $! > /tmp/fleet-backend.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://localhost:4000/api/v1/health > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to become healthy."
          cat /tmp/fleet-backend.log
          exit 1

      - name: Module scope API tests
        run: npm run test:module-scope-api
        working-directory: backend

      - name: User profile link tests
        run: npm run test:user-profile-link
        working-directory: backend

      - name: User profile link API tests
        run: npm run test:user-profile-link-api
        working-directory: backend

      - name: Profile link diagnostics
        run: npm run profile-link:diagnose
        working-directory: backend

      - name: Driver portal security tests
        run: npm run test:driver-portal-security
        working-directory: backend

      - name: Driver portal action tests
        run: npm run test:driver-portal-actions
        working-directory: backend

      - name: Driver submission review tests
        run: npm run test:driver-submission-review
        working-directory: backend

      - name: Driver advance settlement scenario
        run: npm run test:driver-advance-settlement
        working-directory: backend

      - name: Driver portal integration tests
        run: npm run test:driver-portal-integration
        working-directory: backend

      - name: Workspace engine tests
        run: npm run test:workspace-engine
        working-directory: backend

      - name: Dashboard permission gate
        run: npm run test:rbac-dashboard
        working-directory: backend

      - name: Mechanic assignment isolation
        run: npm run test:rbac-mechanic
        working-directory: backend

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/fleet-backend.log || true

  frontend:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Web lint
        run: npm run lint
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

  mobile:
    name: Mobile lint and Expo validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Mobile TypeScript check
        run: npm run lint
        working-directory: mobile

      - name: Expo project validation
        run: npm run doctor
        working-directory: mobile

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1

      - name: Generate npm audit reports
        shell: bash
        run: |
          set +e
          npm audit --json > audit-root.json
          ROOT_EXIT=$?

          cd mobile
          npm audit --json > ../audit-mobile.json
          MOBILE_EXIT=$?
          cd ..

          printf '{"root":%s,"mobile":%s}\n' "$ROOT_EXIT" "$MOBILE_EXIT" > audit-exit-codes.json
          exit 0

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-reports
          path: |
            audit-root.json
            audit-mobile.json
            audit-exit-codes.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce high and critical vulnerability gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const reportFiles = [
            ['backend/web workspace', 'audit-root.json'],
            ['mobile', 'audit-mobile.json'],
          ];

          let shouldFail = false;

          for (const [label, file] of reportFiles) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            const high = Number(counts.high ?? 0);
            const critical = Number(counts.critical ?? 0);

            console.log(`\n${label}: ${high} high, ${critical} critical`);

            for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
              if (!['high', 'critical'].includes(vulnerability.severity)) continue;
              const via = (vulnerability.via ?? [])
                .map((entry) => typeof entry === 'string' ? entry : `${entry.title ?? entry.name ?? 'advisory'} (${entry.url ?? 'no URL'})`)
                .join('; ');
              console.log(`- ${name}: ${vulnerability.severity}; fixAvailable=${JSON.stringify(vulnerability.fixAvailable)}; via=${via}`);
            }

            if (high > 0 || critical > 0) shouldFail = true;
          }

          if (shouldFail) {
            console.error('\nHigh or critical dependency vulnerabilities remain.');
            process.exit(1);
          }
          NODE

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results

      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - backend
      - frontend
      - mobile
      - dependency-audit
      - dependency-review
      - codeql
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        shell: bash
        run: |
          set -euo pipefail

          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$MOBILE_RESULT" = "success"
          test "$AUDIT_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"

          case "$DEPENDENCY_REVIEW_RESULT" in
            success|skipped) ;;
            *)
              echo "Dependency review result was $DEPENDENCY_REVIEW_RESULT."
              exit 1
              ;;
          esac

          echo "All required CI and security checks passed."

  sync-backend:
    name: Sync backend to partner repository
    needs: quality-gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: ${{ secrets.TARGET_REPO }}
      TARGET_BRANCH: ${{ secrets.TARGET_BACKEND_BRANCH }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Validate synchronization configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TARGET_REPO" || { echo "TARGET_REPO is not configured."; exit 1; }
          test -n "$TARGET_BRANCH" || { echo "TARGET_BACKEND_BRANCH is not configured."; exit 1; }
          test -n "${{ secrets.TARGET_REPO_PAT }}" || { echo "TARGET_REPO_PAT is not configured."; exit 1; }

          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "The destination repository must be different from the source repository."
            exit 1
          fi

          case "$TARGET_BRANCH" in
            main|master)
              echo "Refusing to replace a destination main/master branch. Use a dedicated backend branch."
              exit 1
              ;;
          esac

      - name: Check out successful source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out destination backend branch
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ secrets.TARGET_BACKEND_BRANCH }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare sanitized backend snapshot
        shell: bash
        run: |
          set -euo pipefail

          test -d source/backend || { echo "source/backend was not found."; exit 1; }

          rm -rf backend-snapshot
          mkdir -p backend-snapshot

          rsync -a --delete \
            --include='.env.example' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='coverage/' \
            --exclude='.cache/' \
            --exclude='.turbo/' \
            --exclude='.storage/' \
            --exclude='uploads/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='*.log' \
            source/backend/ backend-snapshot/

          test -n "$(find backend-snapshot -mindepth 1 -print -quit)" || {
            echo "The sanitized backend snapshot is empty."
            exit 1
          }

      - name: Replace destination with root backend folder
        shell: bash
        run: |
          set -euo pipefail

          find target \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          mkdir -p target/backend
          rsync -a --delete backend-snapshot/ target/backend/

          cat > target/.gitignore <<'EOF'
          backend/node_modules/
          backend/dist/
          backend/build/
          backend/coverage/
          backend/.env
          backend/.env.*
          !backend/.env.example
          backend/.storage/
          backend/uploads/
          backend/test-results/
          backend/playwright-report/
          *.log
          EOF

          diff -qr backend-snapshot target/backend
          test -f target/backend/package.json || {
            echo "Expected target/backend/package.json was not created."
            exit 1
          }

      - name: Commit and push backend synchronization
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail

          git config user.name "fleet-backend-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "The destination backend is already synchronized."
            exit 0
          fi

          SHORT_SHA="${SOURCE_SHA:0:12}"
          git commit -m "sync: backend from ${GITHUB_REPOSITORY}@${SHORT_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write synchronization summary
        shell: bash
        run: |
          {
            echo "## Backend synchronization"
            echo ""
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Destination: \`${TARGET_REPO}\` / \`${TARGET_BRANCH}\`"
            echo "- Backend location: repository root \`backend/\` folder"
            echo "- Result: synchronized only after the complete quality gate passed"
            echo "- Secrets and generated files: excluded"
          } >> "$GITHUB_STEP_SUMMARY"

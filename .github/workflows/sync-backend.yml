name: Sync Backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-backend-to-partner
  cancel-in-progress: true

jobs:
  sync-backend:
    name: Sync successful backend to partner branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: ${{ secrets.TARGET_REPO }}
      TARGET_BRANCH: ${{ secrets.TARGET_BACKEND_BRANCH }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Validate synchronization configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$TARGET_REPO" ]; then
            echo "TARGET_REPO is not configured."
            exit 1
          fi

          if [ -z "$TARGET_BRANCH" ]; then
            echo "TARGET_BACKEND_BRANCH is not configured."
            exit 1
          fi

          if [ -z "${{ secrets.TARGET_REPO_PAT }}" ]; then
            echo "TARGET_REPO_PAT is not configured."
            exit 1
          fi

          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "The destination repository must be different from the source repository."
            exit 1
          fi

          case "$TARGET_BRANCH" in
            main|master)
              echo "Refusing to replace a destination main/master branch. Use a dedicated backend branch."
              exit 1
              ;;
          esac

      - name: Check out successful source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source backend
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d source/backend ]; then
            echo "source/backend was not found."
            exit 1
          fi

          if [ -z "$(find source/backend -mindepth 1 -print -quit)" ]; then
            echo "source/backend is empty."
            exit 1
          fi

      - name: Check out destination backend branch
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ secrets.TARGET_BACKEND_BRANCH }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare sanitized backend snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend-snapshot
          mkdir -p backend-snapshot

          rsync -a --delete \
            --include='.env.example' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='coverage/' \
            --exclude='.cache/' \
            --exclude='.turbo/' \
            --exclude='.storage/' \
            --exclude='uploads/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='*.log' \
            source/backend/ backend-snapshot/

          if [ -z "$(find backend-snapshot -mindepth 1 -print -quit)" ]; then
            echo "The sanitized backend snapshot is empty."
            exit 1
          fi

      - name: Replace destination branch with backend snapshot
        shell: bash
        run: |
          set -euo pipefail

          find target \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          mkdir -p target/backend
          rsync -a --delete backend-snapshot/ target/backend/

          diff -qr backend-snapshot target/backend

      - name: Commit and push backend synchronization
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail

          git config user.name "fleet-backend-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "The destination backend is already synchronized."
            exit 0
          fi

          SHORT_SHA="${SOURCE_SHA:0:12}"
          git commit -m "sync: backend from ${GITHUB_REPOSITORY}@${SHORT_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write synchronization summary
        shell: bash
        run: |
          {
            echo "## Backend synchronization"
            echo ""
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Destination branch: configured dedicated backend branch"
            echo "- Result: synchronized after successful CI"
            echo "- Secrets and generated files: excluded"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Vercel production after CI

on:
  workflow_run:
    workflows: ["CI, Security and Backend Sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vercel-production-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production deployment gate and secrets
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DEPLOY_DIRECT_URL: ${{ secrets.DEPLOY_DIRECT_URL }}
    steps:
      - name: Confirm CI-success production context
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.head_branch }}" = "main"
          else
            test "${{ github.ref }}" = "refs/heads/main"
          fi

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_BACKEND_PROJECT_ID
            VERCEL_WEB_PROJECT_ID
            DEPLOY_DATABASE_URL
            DEPLOY_DIRECT_URL
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the staging GitHub environment or repository secrets."
              missing=1
            fi
          done

          test "$missing" -eq 0

      - name: Explain deployment ownership and URLs
        shell: bash
        run: |
          {
            echo "## Deployment target"
            echo ""
            echo "- Deployment owner: GitHub Actions"
            echo "- GitHub environment: \`staging\` (secret storage only)"
            echo "- Vercel target: \`production\`"
            echo "- Source branch: \`main\`"
            echo "- Stable production domains are used by applications and health checks."
            echo "- Immutable deployment URLs are retained only for audit and rollback."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Migrate database and deploy backend production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      deployment: false
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DEPLOY_DIRECT_URL }}
    outputs:
      backend_production_url: ${{ steps.resolve.outputs.production_url }}
      backend_deployment_url: ${{ steps.resolve.outputs.deployment_url }}
    steps:
      - name: Check out the CI-approved commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend

      - name: Apply committed database migrations
        run: npm run prisma:migrate:deploy
        working-directory: backend

      - name: Link backend Vercel project
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: backend

      - name: Validate backend Vercel production environment
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail

          env_file=".vercel/.env.production.local"
          test -f "$env_file" || {
            echo "::error::Vercel did not return a production environment file for the backend project. Verify VERCEL_BACKEND_PROJECT_ID and VERCEL_ORG_ID."
            exit 1
          }

          required_runtime=(DATABASE_URL DIRECT_URL JWT_SECRET CORS_ORIGIN)
          missing=0
          for name in "${required_runtime[@]}"; do
            if ! grep -Eq "^${name}=" "$env_file"; then
              echo "::error::$name is missing from the backend Vercel project's Production environment variables."
              missing=1
            fi
          done

          test "$missing" -eq 0
          echo "Backend Vercel production environment contains all required variable names."

      - name: Deploy backend production
        id: deploy
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail

          DEPLOYMENT_URL="$({
            npx --yes vercel@latest deploy \
              --prod \
              --yes \
              --archive=tgz \
              --token="$VERCEL_TOKEN" \
              --meta githubCommitSha="$DEPLOY_SHA"
          } | tail -n 1 | tr -d '\r')"

          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *)
              echo "::error::Vercel CLI did not return a valid backend deployment URL."
              exit 1
              ;;
          esac

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Backend production deployment created."

      - name: Resolve stable backend production domain
        id: resolve
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_BACKEND_PRODUCTION_URL }}
        run: node .github/scripts/resolve-vercel-production-url.mjs

      - name: Verify backend through stable production domain
        shell: bash
        env:
          BACKEND_PRODUCTION_URL: ${{ steps.resolve.outputs.production_url }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 18 \
            --retry-delay 5 \
            --retry-all-errors \
            "$BACKEND_PRODUCTION_URL/api/v1/health" > /tmp/backend-health.json

          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync("/tmp/backend-health.json", "utf8"));
            if (!body || body.success === false) process.exit(1);
          '

  deploy-web:
    name: Deploy web production after backend health passes
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      deployment: false
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      BACKEND_PRODUCTION_URL: ${{ needs.deploy-backend.outputs.backend_production_url }}
    outputs:
      web_production_url: ${{ steps.resolve.outputs.production_url }}
      web_deployment_url: ${{ steps.resolve.outputs.deployment_url }}
    steps:
      - name: Check out the CI-approved commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Link web Vercel project
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: web

      - name: Deploy web production with stable backend API URL
        id: deploy
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail

          test -n "$BACKEND_PRODUCTION_URL"

          DEPLOYMENT_URL="$({
            npx --yes vercel@latest deploy \
              --prod \
              --yes \
              --archive=tgz \
              --token="$VERCEL_TOKEN" \
              --build-env VITE_API_URL="$BACKEND_PRODUCTION_URL" \
              --meta githubCommitSha="$DEPLOY_SHA"
          } | tail -n 1 | tr -d '\r')"

          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *)
              echo "::error::Vercel CLI did not return a valid web deployment URL."
              exit 1
              ;;
          esac

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Web production deployment created."

      - name: Resolve stable web production domain
        id: resolve
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_WEB_PRODUCTION_URL }}
        run: node .github/scripts/resolve-vercel-production-url.mjs

      - name: Verify web through stable production domain
        shell: bash
        env:
          WEB_PRODUCTION_URL: ${{ steps.resolve.outputs.production_url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$WEB_PRODUCTION_URL/" > /dev/null
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$WEB_PRODUCTION_URL/login" > /dev/null

  deployment-summary:
    name: Publish production deployment summary
    if: always()
    needs:
      - validate
      - deploy-backend
      - deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Enforce deployment result and write summary
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          BACKEND_PRODUCTION_URL: ${{ needs.deploy-backend.outputs.backend_production_url }}
          BACKEND_DEPLOYMENT_URL: ${{ needs.deploy-backend.outputs.backend_deployment_url }}
          WEB_PRODUCTION_URL: ${{ needs.deploy-web.outputs.web_production_url }}
          WEB_DEPLOYMENT_URL: ${{ needs.deploy-web.outputs.web_deployment_url }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Vercel production deployment"
            echo ""
            echo "- Validation: \`$VALIDATE_RESULT\`"
            echo "- Backend: \`$BACKEND_RESULT\`"
            echo "- Web: \`$WEB_RESULT\`"
            echo ""
            echo "### Stable production URLs"
            [ -n "$BACKEND_PRODUCTION_URL" ] && echo "- Backend: $BACKEND_PRODUCTION_URL"
            [ -n "$WEB_PRODUCTION_URL" ] && echo "- Web: $WEB_PRODUCTION_URL"
            echo ""
            echo "### Immutable deployment URLs (audit and rollback)"
            [ -n "$BACKEND_DEPLOYMENT_URL" ] && echo "- Backend deployment: $BACKEND_DEPLOYMENT_URL"
            [ -n "$WEB_DEPLOYMENT_URL" ] && echo "- Web deployment: $WEB_DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$VALIDATE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$WEB_RESULT" = "success"

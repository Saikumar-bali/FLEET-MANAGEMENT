name: Gated Backend Sync

on:
  workflow_run:
    workflows:
      - CI, Security and Backend Sync
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gated-backend-sync
  cancel-in-progress: true

jobs:
  sync-backend:
    name: Sync successful main backend to partner repository
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: ${{ secrets.TARGET_REPO }}
      TARGET_BRANCH: ${{ secrets.TARGET_BACKEND_BRANCH }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Validate synchronization configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TARGET_REPO" || { echo "TARGET_REPO is not configured."; exit 1; }
          test -n "$TARGET_BRANCH" || { echo "TARGET_BACKEND_BRANCH is not configured."; exit 1; }
          test -n "${{ secrets.TARGET_REPO_PAT }}" || { echo "TARGET_REPO_PAT is not configured."; exit 1; }
          test -n "$SOURCE_SHA" || { echo "SOURCE_SHA could not be resolved."; exit 1; }

          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "The destination repository must be different from the source repository."
            exit 1
          fi

          case "$TARGET_BRANCH" in
            main|master)
              echo "Refusing to replace a destination main/master branch. Use a dedicated backend branch."
              exit 1
              ;;
          esac

      - name: Check out successful source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out destination backend branch
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ secrets.TARGET_BACKEND_BRANCH }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare sanitized backend snapshot
        shell: bash
        run: |
          set -euo pipefail

          test -d source/backend || { echo "source/backend was not found."; exit 1; }

          rm -rf backend-snapshot
          mkdir -p backend-snapshot

          rsync -a --delete \
            --include='.env.example' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='coverage/' \
            --exclude='.cache/' \
            --exclude='.turbo/' \
            --exclude='.storage/' \
            --exclude='uploads/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='*.log' \
            source/backend/ backend-snapshot/

          test -n "$(find backend-snapshot -mindepth 1 -print -quit)" || {
            echo "The sanitized backend snapshot is empty."
            exit 1
          }

      - name: Replace destination with repository-root backend folder
        shell: bash
        run: |
          set -euo pipefail

          find target \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          mkdir -p target/backend
          rsync -a --delete backend-snapshot/ target/backend/

          cat > target/.gitignore <<'EOF'
          backend/node_modules/
          backend/dist/
          backend/build/
          backend/coverage/
          backend/.env
          backend/.env.*
          !backend/.env.example
          backend/.storage/
          backend/uploads/
          backend/test-results/
          backend/playwright-report/
          *.log
          EOF

          diff -qr backend-snapshot target/backend
          test -f target/backend/package.json || {
            echo "Expected target/backend/package.json was not created."
            exit 1
          }

      - name: Commit and push backend synchronization
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail

          git config user.name "fleet-backend-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "The destination backend is already synchronized."
            exit 0
          fi

          SHORT_SHA="${SOURCE_SHA:0:12}"
          git commit -m "sync: backend from ${GITHUB_REPOSITORY}@${SHORT_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write synchronization summary
        shell: bash
        run: |
          {
            echo "## Backend synchronization"
            echo ""
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Destination: \`${TARGET_REPO}\` / \`${TARGET_BRANCH}\`"
            echo "- Backend location: repository root \`backend/\` folder"
            echo "- Trigger: successful main CI or manual recovery on main"
            echo "- Secrets and generated files: excluded"
          } >> "$GITHUB_STEP_SUMMARY"

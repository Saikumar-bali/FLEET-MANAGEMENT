name: Mobile Security Upgrade Preview

on:
  push:
    branches: ["agent/backend-sync-security"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-security-upgrade-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Generate Expo upgrade preview and diagnostics
        shell: bash
        working-directory: mobile
        run: |
          set +e

          npm install expo@^57.0.0 > upgrade.log 2>&1
          INSTALL_EXIT=$?

          npx expo install --fix >> upgrade.log 2>&1
          ALIGN_EXIT=$?

          npm run lint > lint.log 2>&1
          LINT_EXIT=$?

          npx expo-doctor > expo-doctor.log 2>&1
          DOCTOR_EXIT=$?

          npm audit --json > audit-mobile-upgraded.json
          AUDIT_EXIT=$?

          printf '{"install":%s,"align":%s,"lint":%s,"doctor":%s,"audit":%s}\n' \
            "$INSTALL_EXIT" "$ALIGN_EXIT" "$LINT_EXIT" "$DOCTOR_EXIT" "$AUDIT_EXIT" \
            > upgrade-exit-codes.json

          exit 0

      - name: Upload upgraded mobile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-security-upgrade
          path: |
            mobile/package.json
            mobile/package-lock.json
            mobile/upgrade.log
            mobile/lint.log
            mobile/expo-doctor.log
            mobile/audit-mobile-upgraded.json
            mobile/upgrade-exit-codes.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce upgrade preview checks
        shell: bash
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const exits = JSON.parse(fs.readFileSync('upgrade-exit-codes.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync('audit-mobile-upgraded.json', 'utf8'));
          const vulnerabilities = audit.metadata?.vulnerabilities ?? {};
          const high = Number(vulnerabilities.high ?? 0);
          const critical = Number(vulnerabilities.critical ?? 0);

          console.log({ exits, high, critical });

          if (exits.install !== 0 || exits.align !== 0 || exits.lint !== 0 || exits.doctor !== 0 || high > 0 || critical > 0) {
            process.exit(1);
          }
          NODE

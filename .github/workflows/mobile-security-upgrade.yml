name: Mobile Security Upgrade Preview

on:
  push:
    branches: ["agent/backend-sync-security"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-security-upgrade-preview
  cancel-in-progress: true

jobs:
  upgrade-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v6
        with:
          ref: agent/backend-sync-security
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Align Expo SDK dependencies
        working-directory: mobile
        run: |
          npm install
          npx expo install --fix

      - name: Run mobile TypeScript check
        working-directory: mobile
        run: npm run lint

      - name: Run Expo Doctor
        working-directory: mobile
        run: npm run doctor

      - name: Enforce high and critical vulnerability gate
        working-directory: mobile
        run: npm audit --audit-level=high

      - name: Commit generated mobile lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fleet-security-upgrade[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json

          if git diff --cached --quiet; then
            echo "Mobile dependency manifests are already synchronized."
            exit 0
          fi

          git commit -m "chore: regenerate Expo 57 mobile lockfile"
          git push origin HEAD:agent/backend-sync-security

name: Mobile Security Upgrade Preview

on:
  push:
    branches: ["agent/backend-sync-security"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-security-upgrade-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Upgrade Expo SDK and align dependencies
        working-directory: mobile
        run: |
          npm install expo@^57.0.0
          npx expo install --fix

      - name: Run mobile TypeScript check
        working-directory: mobile
        run: npm run lint

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Verify dependency audit
        working-directory: mobile
        run: npm audit --audit-level=high

      - name: Upload upgraded mobile manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-security-upgrade
          path: |
            mobile/package.json
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 7

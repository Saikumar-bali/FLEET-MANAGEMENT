name: Mobile Security Upgrade Preview

on:
  push:
    branches: ["agent/backend-sync-security"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-security-upgrade-preview
  cancel-in-progress: true

jobs:
  upgrade-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v6
        with:
          ref: agent/backend-sync-security
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Align Expo SDK dependencies
        working-directory: mobile
        run: |
          npm install
          npx expo install --fix

      - name: Run mobile TypeScript check
        working-directory: mobile
        run: npm run lint

      - name: Collect Expo Doctor result
        shell: bash
        working-directory: mobile
        run: |
          set +e
          npm run doctor > expo-doctor-final.log 2>&1
          echo $? > expo-doctor-exit.txt
          exit 0

      - name: Collect dependency audit result
        shell: bash
        working-directory: mobile
        run: |
          set +e
          npm audit --json > audit-mobile-final.json
          echo $? > audit-exit.txt
          exit 0

      - name: Commit generated mobile lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fleet-security-upgrade[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json

          if git diff --cached --quiet; then
            echo "Mobile dependency manifests are already synchronized."
            exit 0
          fi

          git commit -m "chore: regenerate Expo 57 mobile lockfile"
          git push origin HEAD:agent/backend-sync-security

      - name: Upload final mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-security-final-diagnostics
          path: |
            mobile/expo-doctor-final.log
            mobile/expo-doctor-exit.txt
            mobile/audit-mobile-final.json
            mobile/audit-exit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce final mobile security checks
        shell: bash
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const doctorExit = Number(fs.readFileSync('expo-doctor-exit.txt', 'utf8').trim());
          const audit = JSON.parse(fs.readFileSync('audit-mobile-final.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          const high = Number(counts.high ?? 0);
          const critical = Number(counts.critical ?? 0);

          console.log({ doctorExit, high, critical });

          if (doctorExit !== 0 || high > 0 || critical > 0) {
            process.exit(1);
          }
          NODE

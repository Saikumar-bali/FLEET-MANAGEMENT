version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Kolkata
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      backend-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      backend-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Kolkata
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      web-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      web-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      mobile-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      mobile-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security
